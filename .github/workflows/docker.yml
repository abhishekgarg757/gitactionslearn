name: Docker

# `on` = when this workflow should run
on:
  push:
    branches: [main]     # automatic when main changes
  workflow_dispatch:     # manual "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    # `needs` = wait for this job first. If `test` fails, this job never runs,
    # so a broken test can never publish an image.
    needs: test

    runs-on: ubuntu-latest

    # `environment` = run inside the GitHub Environment called "production",
    # which can require reviewers and hold its own secrets/variables.
    environment: production

    env:
      APP_NAME: github-actions-demo
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub. Credentials come from GitHub Secrets, never from
      # the repository files.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
